name: Refresh commit activity

# Runs entirely on GitHub. Nothing on any local machine is involved, so the
# commit heatmap on /agents stays current whether or not Christopher's PC is on.
#
# Claude token/session data cannot work this way — it only exists in local
# session transcripts, and no API exposes it — so that half is refreshed by
# `npm run agent-status` when he feels like it. This half never goes stale.

on:
  schedule:
    - cron: '17 6 * * *' # 06:17 UTC daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: activity
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Build commit activity
        env:
          # The default token reads this repo. To include private repos, set a
          # PAT with `repo` scope as the ACTIVITY_TOKEN secret.
          GITHUB_TOKEN: ${{ secrets.ACTIVITY_TOKEN || github.token }}
          GITHUB_LOGIN: ${{ github.repository_owner }}
        run: node scripts/commit-activity.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- public/commit-activity.json; then
            echo "No change in commit activity."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/commit-activity.json
          git commit -m "Refresh commit activity"
          git push
